apply plugin: 'com.android.library'

android {
    def compileSdk = rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    def minSdk = rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 21
    def targetSdk = rootProject.ext.has('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34

    compileSdkVersion compileSdk
    namespace "com.techdigga.easyump"

    defaultConfig {
        minSdkVersion minSdk
        targetSdkVersion targetSdk
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // Compile against UnityPlayer APIs without packaging Unity classes in this AAR.
    compileOnly files("${project(':unityLibrary').projectDir}/libs/unity-classes.jar")
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
